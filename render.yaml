# Blueprint Render — déploiement DÉMO mono-service du Barreau de Pointe-Noire.
# Un seul service web sert l'API Express ET le front React compilé (même origine,
# pas de CORS) + une base PostgreSQL gérée. Voir docs/DEPLOIEMENT-RENDER.md.
#
# ⚠️ Démo : PostgreSQL « free » est supprimée après 90 jours, le service web
# s'endort après ~15 min d'inactivité, et chaque déploiement relance le seed
# (réinitialise les données). Ne pas utiliser pour des données réelles.

databases:
  - name: barreau-pn-db
    databaseName: barreau_pn
    plan: free

services:
  - type: web
    name: barreau-pn
    runtime: node
    plan: free
    # --include=dev : tsx, prisma et vite sont en devDependencies ; le mode
    # production de npm les ignorerait sinon (node_modules persiste au runtime).
    buildCommand: >-
      npm install --include=dev &&
      npm run build &&
      npm install --prefix server --include=dev &&
      npm run prisma:generate --prefix server &&
      npm run prisma:deploy --prefix server &&
      npm run seed --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Le front compilé (dist, à la racine) servi par l'API. Résolu depuis le
      # dossier server/ au démarrage → ../dist.
      - key: STATIC_DIR
        value: ../dist
      - key: DATABASE_URL
        fromDatabase:
          name: barreau-pn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # PORT est injecté automatiquement par Render.
      # SMTP_*, SMS_*, PAYMENT_*, ANTHROPIC_API_KEY laissés vides → simulation.
