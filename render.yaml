# Blueprint Render — service web du Barreau de Pointe-Noire.
# Un seul service web sert l'API Express ET le front React compilé (même origine,
# pas de CORS). La base PostgreSQL est HÉBERGÉE HORS RENDER (serveur Docker aaPanel) :
# DATABASE_URL est renseignée manuellement dans le dashboard Render, pas ici.
# Voir docs/DEPLOIEMENT-RENDER.md.
#
# ⚠️ Le service web « free » s'endort après ~15 min d'inactivité.
# Les données sont persistées sur la base externe : le build n'exécute PLUS le seed
# (qui est destructif — cf. server/prisma/seed.ts). Seules les migrations sont
# appliquées à chaque déploiement (idempotentes et non destructives).

services:
  - type: web
    name: barreau-pn
    runtime: node
    plan: free
    # --include=dev : tsx, prisma et vite sont en devDependencies ; le mode
    # production de npm les ignorerait sinon (node_modules persiste au runtime).
    # Chrome est téléchargé au build par @puppeteer/browsers dans un dossier du
    # projet (persistant au runtime) → génération PDF (reçus, quitus,
    # attestations…) opérationnelle. Le serveur le localise via PUPPETEER_CACHE_DIR.
    # ⚠️ PAS de « npm run seed » ici : le seed réinitialise TOUTES les tables
    # (server/prisma/seed.ts) et effacerait les données de production à chaque
    # déploiement. Le seed initial a été lancé une seule fois, manuellement.
    # Seul prisma:deploy (migrations idempotentes) tourne au build.
    buildCommand: >-
      npm install --include=dev &&
      npm run build &&
      npm install --prefix server --include=dev &&
      (cd server && npx @puppeteer/browsers install chrome@stable --path /opt/render/project/src/.cache/puppeteer) &&
      npm run prisma:generate --prefix server &&
      npm run prisma:deploy --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Le front compilé (dist, à la racine) servi par l'API. Résolu depuis le
      # dossier server/ au démarrage → ../dist.
      - key: STATIC_DIR
        value: ../dist
      # Base PostgreSQL externe (serveur Docker aaPanel). La valeur contient un
      # mot de passe : elle N'EST PAS versionnée ici. À renseigner dans le
      # dashboard Render (Environment) — sync:false empêche Render de la gérer
      # via ce blueprint et de la remettre à zéro.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Emplacement du Chrome téléchargé au build (sous le projet → persiste au
      # runtime). Lu par le serveur (lib/pdf.ts) pour lancer Puppeteer.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # PORT est injecté automatiquement par Render.
      # SMTP_*, SMS_*, PAYMENT_*, ANTHROPIC_API_KEY laissés vides → simulation.
